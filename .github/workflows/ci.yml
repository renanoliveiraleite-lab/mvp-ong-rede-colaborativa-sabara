name: CI - Testes Automatizados MVP

on:
  push:
    branches: [ main, feature/mvp-ong-rcb ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias de teste
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Executar testes unitarios e de integracao
      run: |
        pytest -v --cov=backend
